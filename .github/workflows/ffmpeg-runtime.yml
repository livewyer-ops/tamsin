name: FFmpeg runtime

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.ffmpeg
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ffmpeg-runtime
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'livewyer-ops/tamsin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUNTIME_IMAGE: ghcr.io/livewyer-ops/tamsin-ffmpeg-runtime:5.1.9-bookworm-r2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable tag
        id: immutable-tag
        run: |
          if lookup=$(docker buildx imagetools inspect "$RUNTIME_IMAGE" 2>&1); then
            echo "Runtime tag already exists; increment its revision before rebuilding." >&2
            exit 1
          fi
          case "$lookup" in
            "ERROR: $RUNTIME_IMAGE: not found") ;;
            *) printf 'Cannot establish that the runtime tag is absent: %s\n' "$lookup" >&2; exit 1 ;;
          esac
      - name: Build and publish runtime
        id: runtime
        run: |
          mkdir -p .tmp
          docker buildx build \
            --file Dockerfile.ffmpeg \
            --platform linux/amd64,linux/arm64 \
            --push \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file .tmp/runtime-metadata.json \
            --build-arg BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")" \
            --tag "$RUNTIME_IMAGE" \
            .
          digest=$(jq -er '."containerimage.digest"' .tmp/runtime-metadata.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest runtime
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/livewyer-ops/tamsin-ffmpeg-runtime
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
