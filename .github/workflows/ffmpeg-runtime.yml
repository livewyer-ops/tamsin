name: FFmpeg runtime

on:
  # The first reviewed branch that introduces a new revision bootstraps its
  # immutable tag before application-image CI consumes it. Existing tags are
  # accepted but never overwritten.
  push:
    paths:
      - Dockerfile.ffmpeg
      - contracts/ffmpeg-runtime.json
      - .github/workflows/ffmpeg-runtime.yml
      - scripts/resolve-image-reference.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ffmpeg-runtime-5.1.9-bookworm-r1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'livewyer-ops/tamsin'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the runtime contract
        id: contract
        run: |
          image="$(jq -er '.image | select(type == "string" and length > 0)' contracts/ffmpeg-runtime.json)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "subject_name=${image%:*}" >> "$GITHUB_OUTPUT"
      - name: Set up pinned QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
          platforms: arm64
      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether the immutable revision already exists
        id: existing
        env:
          RUNTIME_IMAGE: ${{ steps.contract.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$RUNTIME_IMAGE" >/dev/null 2>&1; then
            immutable="$(./scripts/resolve-image-reference.sh "$RUNTIME_IMAGE")"
            echo "The immutable runtime already exists: $immutable"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish the two-platform runtime once
        if: steps.existing.outputs.exists != 'true'
        env:
          RUNTIME_IMAGE: ${{ steps.contract.outputs.image }}
        run: |
          build_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          build_date="$(date --utc --date="@$build_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build \
            --file Dockerfile.ffmpeg \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max \
            --sbom=true \
            --build-arg BUILD_DATE="$build_date" \
            --tag "$RUNTIME_IMAGE" \
            --push \
            .
      - name: Resolve and validate the published runtime
        if: steps.existing.outputs.exists != 'true'
        id: published
        env:
          RUNTIME_IMAGE: ${{ steps.contract.outputs.image }}
        run: |
          immutable="$(./scripts/resolve-image-reference.sh "$RUNTIME_IMAGE")"
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
          echo "digest=${immutable##*@}" >> "$GITHUB_OUTPUT"
      - name: Add GitHub build provenance to the runtime index
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.contract.outputs.subject_name }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
