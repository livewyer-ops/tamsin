name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        run: |
          ./scripts/release-notes.py "$GITHUB_REF_NAME" CHANGELOG.md >/dev/null
          python3 ./scripts/check-release-gate.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: make verify

  e2e:
    needs: verify
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: [verify, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binaries
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          make dist VERSION="$version" COMMIT="$GITHUB_SHA" BUILD_DATE="$build_date"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
      - name: Attest release binaries
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/tamsin-linux-amd64
            dist/tamsin-linux-arm64
            dist/tamsin-darwin-amd64
            dist/tamsin-darwin-arm64
            dist/tamsin-third-party-licenses.tar.gz
            dist/SHA256SUMS
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable release tag
        id: immutable-tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          release_image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          if lookup=$(docker buildx imagetools inspect "$release_image" 2>&1); then
            echo "Release image tag already exists; use a new version." >&2
            exit 1
          fi
          case "$lookup" in
            "ERROR: $release_image: not found") ;;
            *) printf 'Cannot establish that the release tag is absent: %s\n' "$lookup" >&2; exit 1 ;;
          esac
      - name: Build candidate container image
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version='${{ steps.release.outputs.version }}'
          mkdir -p .tmp
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file .tmp/image-metadata.json \
            --build-arg VERSION="$version" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE='${{ steps.release.outputs.build_date }}' \
            --tag "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            .
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '.[\"containerimage.digest\"]' .tmp/image-metadata.json)" >> "$GITHUB_OUTPUT"
      - name: Smoke both image architectures
        id: image-smoke
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$IMAGE" --help >/dev/null
            docker run --rm --platform "$platform" "$IMAGE" doctor --format json >/dev/null
            user=$(docker image inspect --platform "$platform" "$IMAGE" --format '{{.Config.User}}')
            case "$user" in ''|0|0:*|root|root:*) echo "Unsafe image user: $user" >&2; exit 1 ;; esac
          done
      - name: Attest container image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Assign release image tags
        id: image-tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            major="${VERSION%%.*}"
            remainder="${VERSION#*.}"
            minor="${remainder%%.*}"
            tags+=(--tag "$IMAGE:$major.$minor" --tag "$IMAGE:$major" --tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/release-notes.py "$GITHUB_REF_NAME" CHANGELOG.md > .tmp/release-notes.md
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/tamsin-linux-amd64 \
            dist/tamsin-linux-arm64 \
            dist/tamsin-darwin-amd64 \
            dist/tamsin-darwin-arm64 \
            dist/tamsin-third-party-licenses.tar.gz \
            dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file .tmp/release-notes.md \
            "${prerelease[@]}"
