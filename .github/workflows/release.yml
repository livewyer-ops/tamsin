name: Release

# A release is cut by pushing a v-prefixed tag. Nothing here reads a branch,
# so the tag is the only input that decides what ships.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can point at any commit, so it faces the same gate as a pull request.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the signed tag belongs to main
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$tag_ref")" != "tag" ]; then
            echo "$GITHUB_REF_NAME must be an annotated release tag" >&2
            exit 1
          fi
          if ! git cat-file tag "$tag_ref" | grep -q '^-----BEGIN SSH SIGNATURE-----$'; then
            echo "$GITHUB_REF_NAME must carry an SSH signature" >&2
            exit 1
          fi
          if ! ssh-keygen -Y verify \
            -f .github/release-allowed-signers \
            -I release \
            -n git \
            -s <(git cat-file tag "$tag_ref" | sed -n '/^-----BEGIN SSH SIGNATURE-----/,$p') \
            < <(git cat-file tag "$tag_ref" | sed '/^-----BEGIN SSH SIGNATURE-----/,$d'); then
            echo "$GITHUB_REF_NAME is not signed by a trusted release key" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME points outside origin/main" >&2
            exit 1
          fi
      - name: Check no specification gap blocks a release
        run: ./scripts/check-release-gate.sh
      # Verification floats to the newest 1.26 patch so vulnerability checks
      # see standard-library fixes as they ship.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify
        run: make verify

  # Build exactly one amd64+arm64 OCI index into a local layout. The layout and
  # distributions become one immutable Actions artifact only after both image
  # members have executed successfully (arm64 through the pinned QEMU handler).
  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.describe.outputs.version }}
      stable: ${{ steps.describe.outputs.stable }}
      image_ref: ${{ steps.describe.outputs.image_ref }}
      runtime_ref: ${{ steps.runtime.outputs.immutable }}
      image_index_digest: ${{ steps.bundle.outputs.image_index_digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pinned Docker with the containerd image store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: type=archive,version=29.1.3,channel=stable
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up pinned QEMU for the arm64 smoke test
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
          platforms: arm64
      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa

      # The tag is validated before anything is built. Prereleases traverse the
      # same exact-artifact E2E gate; stability controls only release marking and
      # eligibility for the moving latest tag.
      - name: Describe the release
        id: describe
        run: |
          ./scripts/release-version.py describe \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          build_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          build_date="$(date --utc --date="@$build_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          echo "build_epoch=$build_epoch" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Resolve the immutable FFmpeg runtime
        id: runtime
        run: |
          runtime_tag="$(jq -er '.image | select(type == "string" and length > 0)' contracts/ffmpeg-runtime.json)"
          immutable="$(./scripts/resolve-image-reference.sh \
            "$runtime_tag")"
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"

      - name: Build distributions and the two-platform OCI layout once
        run: |
          make dist \
            VERSION="${{ steps.describe.outputs.version }}" \
            COMMIT="${GITHUB_SHA}" \
            BUILD_DATE="${{ steps.describe.outputs.build_date }}" \
            SOURCE_DATE_EPOCH="${{ steps.describe.outputs.build_epoch }}" \
            FFMPEG_RUNTIME_IMAGE="${{ steps.runtime.outputs.immutable }}" \
            IMAGE="${{ steps.describe.outputs.image_ref }}" \
            IMAGE_PLATFORMS="linux/amd64,linux/arm64" \
            OCI_LAYOUT=".tmp/release-bundle/tamsin-image"

      - name: Check the reported version matches the tag
        run: |
          reported="$(./dist/tamsin-linux-amd64 --version)"
          echo "$reported"
          case "$reported" in
            *"${{ steps.describe.outputs.version }}"*) ;;
            *)
              echo "binary reports '$reported', which does not contain ${{ steps.describe.outputs.version }}" >&2
              exit 1
              ;;
          esac

      - name: Build third-party licence and source bundle
        env:
          SOURCE_DATE_EPOCH: ${{ steps.describe.outputs.build_epoch }}
        run: ./scripts/build-third-party-licenses.sh dist/tamsin-third-party-licenses.tar.gz

      - name: Record immutable index and platform identities
        id: bundle
        run: |
          ./scripts/verify-oci-layout.sh record \
            .tmp/release-bundle \
            '${{ steps.describe.outputs.image_ref }}' >> "$GITHUB_OUTPUT"

      - name: Build container metadata and supply-chain bundle
        env:
          SOURCE_DATE_EPOCH: ${{ steps.describe.outputs.build_epoch }}
        run: |
          ./scripts/build-supply-chain-bundle.py \
            --bundle .tmp/release-bundle \
            --image-ref '${{ steps.describe.outputs.image_ref }}' \
            --runtime-ref '${{ steps.runtime.outputs.immutable }}' \
            --version '${{ steps.describe.outputs.version }}' \
            --commit "$GITHUB_SHA" \
            --created '${{ steps.describe.outputs.build_date }}' \
            --metadata-output dist/tamsin-container-metadata.json \
            --archive-output dist/tamsin-supply-chain.tar.gz
          (cd dist && sha256sum tamsin-* > SHA256SUMS)
          cp -a dist .tmp/release-bundle/dist

      - name: Smoke the exact amd64 and arm64 index members
        run: |
          ./scripts/smoke-release-image.sh \
            .tmp/release-bundle \
            '${{ steps.describe.outputs.image_ref }}' \
            '${{ steps.bundle.outputs.image_index_digest }}'

      - name: Upload the immutable release bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tamsin-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/release-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

  # Every SemVer tag, including a prerelease, exercises the already-built
  # amd64 member selected from the exact retained index. No image is rebuilt or
  # published by this reusable job.
  e2e:
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      release_artifact_id: ${{ needs.build.outputs.artifact_id }}
      release_artifact_digest: ${{ needs.build.outputs.artifact_digest }}
      release_image_ref: ${{ needs.build.outputs.image_ref }}
      release_image_index_digest: ${{ needs.build.outputs.image_index_digest }}

  # Publication is downstream of exact-artifact E2E. It copies the retained
  # local OCI index into GHCR, proves the registry returned the same raw index
  # bytes, and only then creates the GitHub release.
  publish:
    needs: [build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: Check the immutable Actions artifact identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-actions-artifact.sh '${{ needs.build.outputs.artifact_id }}' '${{ needs.build.outputs.artifact_digest }}'
      - name: Download the release bundle by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .tmp/release-bundle
      - name: Verify the retained OCI index and distributions
        run: |
          ./scripts/verify-oci-layout.sh verify \
            .tmp/release-bundle \
            '${{ needs.build.outputs.image_ref }}' \
            '${{ needs.build.outputs.image_index_digest }}'
          (cd .tmp/release-bundle/dist && sha256sum --check SHA256SUMS)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the byte-identical multi-platform version index
        run: |
          ./scripts/publish-oci-layout.sh \
            .tmp/release-bundle \
            '${{ needs.build.outputs.image_ref }}' \
            '${{ needs.build.outputs.image_index_digest }}'
      - name: Attest release distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            .tmp/release-bundle/dist/tamsin-linux-amd64
            .tmp/release-bundle/dist/tamsin-linux-arm64
            .tmp/release-bundle/dist/tamsin-darwin-amd64
            .tmp/release-bundle/dist/tamsin-darwin-arm64
            .tmp/release-bundle/dist/tamsin-third-party-licenses.tar.gz
            .tmp/release-bundle/dist/tamsin-container-metadata.json
            .tmp/release-bundle/dist/tamsin-supply-chain.tar.gz
            .tmp/release-bundle/dist/SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/release-notes.py "${GITHUB_REF_NAME}" CHANGELOG.md \
            > .tmp/release-notes.md
          prerelease=""
          if [ "${{ needs.build.outputs.stable }}" != "true" ]; then
            prerelease="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            .tmp/release-bundle/dist/tamsin-linux-amd64 \
            .tmp/release-bundle/dist/tamsin-linux-arm64 \
            .tmp/release-bundle/dist/tamsin-darwin-amd64 \
            .tmp/release-bundle/dist/tamsin-darwin-arm64 \
            .tmp/release-bundle/dist/tamsin-third-party-licenses.tar.gz \
            .tmp/release-bundle/dist/tamsin-container-metadata.json \
            .tmp/release-bundle/dist/tamsin-supply-chain.tar.gz \
            .tmp/release-bundle/dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .tmp/release-notes.md \
            $prerelease

  # Stable promotion is serialized across tags. The newest-tag check prevents
  # an old release rerun from moving latest backwards; the promotion script
  # copies and rechecks the already-published multi-platform index by digest.
  promote:
    needs: [build, publish]
    if: needs.build.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-promote-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pinned ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: Check this is the newest stable release
        id: newest
        run: |
          newest="$(git tag --list 'v*' | ./scripts/release-version.py newest)"
          echo "newest stable tag: ${newest:-none}"
          if [ "$newest" != "${GITHUB_REF_NAME}" ]; then
            echo "not promoting: ${GITHUB_REF_NAME} is older than ${newest}"
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GitHub Container Registry
        if: steps.newest.outputs.promote == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the multi-platform index to latest
        if: steps.newest.outputs.promote == 'true'
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./scripts/promote-oci-index.sh \
            '${{ needs.build.outputs.image_ref }}' \
            '${{ needs.build.outputs.image_index_digest }}' \
            "$repo:latest"
