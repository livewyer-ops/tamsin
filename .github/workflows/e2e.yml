name: TAMOSS end-to-end

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tamoss-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make image IMAGE=tamsin:e2e VERSION=0.0.0-e2e COMMIT="$GITHUB_SHA"
      - run: docker save tamsin:e2e | gzip > tamsin-e2e.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tamsin-e2e-image
          path: tamsin-e2e.tar.gz
          retention-days: 1
          compression-level: 0

  kind:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        contract: [tams-v8.1.json, tams-v8.2.json]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.60.1
          enable_aqua_install: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tamsin-e2e-image
      - run: gunzip --stdout tamsin-e2e.tar.gz | docker load
      - name: Exercise TAMOSS
        env:
          IMAGE: tamsin:e2e
          TAMSIN_E2E_CONTRACT: ${{ matrix.contract }}
        run: make e2e-existing IMAGE="$IMAGE" E2E_PLATFORM=linux/amd64
      - name: Upload TAMOSS diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tamoss-support-bundle-${{ matrix.contract }}-${{ github.run_id }}
          path: .tmp/e2e-support
          retention-days: 14
          if-no-files-found: warn
