name: TAMOSS end-to-end

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tamoss-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make image IMAGE=tamsin:e2e VERSION=0.0.0-e2e COMMIT="$GITHUB_SHA"
      - run: docker save tamsin:e2e | gzip > tamsin-e2e.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tamsin-e2e-image
          path: tamsin-e2e.tar.gz
          retention-days: 1
          compression-level: 0

  kind:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        tams-version: ['8.1', '8.2']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.60.1
          enable_aqua_install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tamsin-e2e-image
      - run: gunzip --stdout tamsin-e2e.tar.gz | docker load
      - name: Exercise TAMOSS
        env:
          IMAGE: tamsin:e2e
          TAMSIN_E2E_VERSION: ${{ matrix.tams-version }}
        run: make e2e-existing IMAGE="$IMAGE" E2E_PLATFORM=linux/amd64
      - name: Upload TAMOSS diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tamoss-support-bundle-${{ matrix.tams-version }}-${{ github.run_id }}
          path: .tmp/e2e-support
          retention-days: 14
          if-no-files-found: warn
