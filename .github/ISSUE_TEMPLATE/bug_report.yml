name: Bug report
description: Report reproducible incorrect TAMSin behaviour.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Report vulnerabilities privately. Remove credentials, signed URLs and customer data from examples and logs.
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: TAMSin version, OS/architecture and image digest if applicable.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include redacted commands, configuration and input characteristics.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor report and logs
      description: Prefer `tamsin doctor --format json`. Confirm that all secrets and customer data are removed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I have removed credentials, signed-URL query values, customer data and private media.
          required: true
        - label: This report does not describe a security vulnerability.
          required: true
